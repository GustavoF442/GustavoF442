<svg xmlns="http://www.w3.org/2000/svg" width="380" height="64" viewBox="0 0 380 64" role="img" aria-label="Ver portfólio">
  <style>
    .shine { animation: shine 4.5s ease-in-out infinite; }
    @keyframes shine { 0%,55% { transform: translateX(-160px) skewX(-20deg); } 100% { transform: translateX(440px) skewX(-20deg); } }
    .arr { animation: arr 1.8s ease-in-out infinite; }
    @keyframes arr { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
    .edge { animation: edge 3s linear infinite; }
    @keyframes edge { to { stroke-dashoffset: -888; } }
  </style>
  <defs><clipPath id="r"><rect width="380" height="64" rx="12"/></clipPath><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <rect x=".75" y=".75" width="378.5" height="62.5" rx="12" fill="#ff6a2b" stroke="#ff6a2b" stroke-width="1.5"/>
  
  <g clip-path="url(#r)"><rect class="shine" x="0" y="-20" width="90" height="104" fill="url(#sh)"/></g>
  <g transform="translate(34,32)" fill="none" stroke="#0b0d0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -8h16v16h-16z M-8 -3h16" /></g>
  <text x="60" y="29" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0d0c">Ver portfólio</text>
  <text x="60" y="47" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="11.5" fill="#3a1a08">gustavof442.github.io</text>
  <g class="arr"><text x="354" y="38" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0d0c" text-anchor="end">↗</text></g>
</svg>