    <text x="28" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8ece9" letter-spacing="-.6">Conversor de imagens</text>
    <circle class="live" cx="511" cy="88" r="4" fill="#3ddc97"/>
    <text x="572" y="92" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="11.5" fill="#3ddc97" text-anchor="end">público</text>
    <text x="28" y="124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a6afaa">Transforma fotos de calçados em desenho técnico 1-bit para</text><text x="28" y="146" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a6afaa">impressoras térmicas Argox, com processamento em lote.</text>
