    <text x="28" y="40" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="12.5" fill="#6e7873">GustavoF442/<tspan fill="#e8ece9" font-weight="700">ConversorDeImagens</tspan></text>
    <circle cx="485" cy="36" r="5" fill="#3178c6"/>
    <text x="572" y="40" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="12.5" fill="#a6afaa" text-anchor="end">TypeScript</text>
    <path d="M28 56 H572" stroke="#222926"/>
