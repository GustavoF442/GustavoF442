<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Conversor de imagens: Transforma fotos de calçados em desenho técnico 1-bit para impressoras térmicas Argox, com processamento em lote.">
  <style>
    .orb { animation: orb 14s ease-in-out infinite alternate; }
    @keyframes orb { 0% { transform: translate(0,0); } 50% { transform: translate(-260px,140px); } 100% { transform: translate(-480px,30px); } }
    .scan { animation: scan 3.6s cubic-bezier(.6,0,.3,1) infinite; }
    @keyframes scan { 0% { transform: translateX(-120px); } 100% { transform: translateX(600px); } }
    .live { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .cell { animation: cell 4s ease-in-out infinite; }
    @keyframes cell { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .pill { animation: pill 6s ease-in-out infinite; }
    @keyframes pill { 0%,70%,100% { transform: translateY(0); } 78% { transform: translateY(-4px); } 86% { transform: translateY(0); } }
    .type { animation: type 6s steps(28) infinite; }
    @keyframes type { 0% { width: 0; } 45%,90% { width: 260px; } 100% { width: 0; } }
  </style>
  <defs>
    <clipPath id="c"><rect width="600" height="250" rx="16"/></clipPath>
    <radialGradient id="g"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".22"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
    <linearGradient id="sl" x1="0" x2="1"><stop offset="0" stop-color="#ff6a2b" stop-opacity="0"/><stop offset=".5" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></linearGradient>
  </defs>
