    <text x="28" y="40" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="12.5" fill="#6e7873">uso interno/<tspan fill="#e8ece9" font-weight="700">SJ Remote</tspan></text>
    <circle cx="543" cy="36" r="5" fill="#178600"/>
    <text x="572" y="40" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="12.5" fill="#a6afaa" text-anchor="end">C#</text>
